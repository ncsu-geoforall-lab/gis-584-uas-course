<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" font-family="Lato, sans-serif">
  <defs>
    <style>
      .t { font-size: 29px; font-weight: bold; fill: #3e3e3e; }
      .sub { font-size: 24px; fill: #6b6b6b; }
      .gear { stroke: #3e3e3e; stroke-width: 5; fill: none; stroke-linecap: round; }
      .ghost { stroke: #c46210; stroke-width: 4; fill: none; stroke-dasharray: 10 7; }
      .base { stroke: #660066; stroke-width: 5; fill: none; stroke-dasharray: 16 10; }
      .err { stroke: #c46210; stroke-width: 6; fill: none; }
    </style>
    <marker id="b-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#660066"/>
    </marker>
    <marker id="b-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c46210"/>
    </marker>
  </defs>

  <!-- ground -->
  <line x1="60" y1="470" x2="1240" y2="470" stroke="#8c8c8c" stroke-width="4"/>

  <!-- base tripod -->
  <line x1="250" y1="300" x2="200" y2="470" class="gear"/>
  <line x1="250" y1="300" x2="300" y2="470" class="gear"/>
  <line x1="250" y1="300" x2="250" y2="470" class="gear"/>
  <ellipse cx="250" cy="288" rx="46" ry="18" fill="#660066"/>
  <text x="250" y="240" class="t" text-anchor="middle" fill="#660066">Base</text>
  <path d="M 236 470 L 250 446 L 264 470 Z" fill="#3e3e3e"/>
  <text x="250" y="512" class="sub" text-anchor="middle">on a fixed mark</text>

  <!-- rover -->
  <line x1="850" y1="470" x2="850" y2="310" class="gear"/>
  <ellipse cx="850" cy="298" rx="38" ry="15" fill="#006600"/>
  <text x="850" y="252" class="t" text-anchor="middle" fill="#006600">Rover</text>
  <rect x="826" y="462" width="48" height="16" fill="#3e3e3e"/>
  <text x="850" y="512" class="sub" text-anchor="middle">on a checkpoint</text>

  <!-- baseline -->
  <line x1="300" y1="288" x2="805" y2="296" class="base" marker-end="url(#b-purple)"/>
  <text x="550" y="272" class="t" text-anchor="middle" fill="#660066">baseline, good to a few cm</text>

  <!-- base error propagates -->
  <line x1="250" y1="288" x2="340" y2="230" class="err" marker-end="url(#b-orange)"/>
  <ellipse cx="352" cy="222" rx="46" ry="18" class="ghost"/>
  <text x="352" y="180" class="sub" text-anchor="middle" fill="#c46210" font-weight="bold">base off by Δ</text>

  <line x1="850" y1="298" x2="940" y2="240" class="err" marker-end="url(#b-orange)"/>
  <ellipse cx="952" cy="232" rx="38" ry="15" class="ghost"/>
  <text x="1010" y="196" class="sub" fill="#c46210" font-weight="bold">every checkpoint</text>
  <text x="1010" y="226" class="sub" fill="#c46210" font-weight="bold">moves by the same Δ</text>

  <!-- methods -->
  <rect x="60" y="548" width="1180" height="74" rx="10" fill="#f2f7f2" stroke="#006600" stroke-width="3"/>
  <text x="90" y="580" class="t" fill="#006600">Where Δ comes from</text>
  <text x="90" y="610" class="sub">A autonomous average: meters &#160;&#160;|&#160;&#160; B network RTK: centimeters &#160;&#160;|&#160;&#160; C static post-processed: centimeters</text>
</svg>
