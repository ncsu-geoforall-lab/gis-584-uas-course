<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 646" font-family="Lato, sans-serif">
  <defs>
    <style>
      .title { font-size: 31px; font-weight: bold; }
      .sub { font-size: 24px; fill: #3e3e3e; }
      .small { font-size: 21px; fill: #6b6b6b; }
      .zero { stroke: #3e3e3e; stroke-width: 3.5; }
      .limit { stroke: #c46210; stroke-width: 2.5; stroke-dasharray: 10 8; }
      .stickA { stroke: #006600; stroke-width: 5; stroke-linecap: round; }
      .stickB { stroke: #660066; stroke-width: 5; stroke-linecap: round; }
      .dotA { fill: #006600; }
      .dotB { fill: #660066; }
      .mean { stroke-width: 4; stroke-dasharray: 16 10; }
    </style>
  </defs>

  <!-- ===== Panel A: random ===== -->
  <text x="60" y="52" class="title" fill="#006600">Random error</text>
  <text x="60" y="86" class="small">mean sits on zero, so aggregates average it away</text>

  <line x1="60" y1="170" x2="600" y2="170" class="limit"/>
  <line x1="60" y1="430" x2="600" y2="430" class="limit"/>
  <text x="60" y="160" class="small" fill="#c46210">+3 x target RMSE</text>
  <text x="60" y="452" class="small" fill="#c46210">-3 x target RMSE</text>

  <line x1="60" y1="300" x2="600" y2="300" class="zero"/>
  <text x="608" y="308" class="small">0</text>

  <g class="stickA">
    <line x1="90"  y1="300" x2="90"  y2="245"/>
    <line x1="135" y1="300" x2="135" y2="340"/>
    <line x1="180" y1="300" x2="180" y2="270"/>
    <line x1="225" y1="300" x2="225" y2="362"/>
    <line x1="270" y1="300" x2="270" y2="252"/>
    <line x1="315" y1="300" x2="315" y2="325"/>
    <line x1="360" y1="300" x2="360" y2="230"/>
    <line x1="405" y1="300" x2="405" y2="335"/>
    <line x1="450" y1="300" x2="450" y2="280"/>
    <line x1="495" y1="300" x2="495" y2="358"/>
    <line x1="540" y1="300" x2="540" y2="258"/>
    <line x1="585" y1="300" x2="585" y2="465"/>
  </g>
  <g class="dotA">
    <circle cx="90" cy="245" r="8"/><circle cx="135" cy="340" r="8"/><circle cx="180" cy="270" r="8"/>
    <circle cx="225" cy="362" r="8"/><circle cx="270" cy="252" r="8"/><circle cx="315" cy="325" r="8"/>
    <circle cx="360" cy="230" r="8"/><circle cx="405" cy="335" r="8"/><circle cx="450" cy="280" r="8"/>
    <circle cx="495" cy="358" r="8"/><circle cx="540" cy="258" r="8"/>
  </g>
  <circle cx="585" cy="465" r="10" fill="#c46210"/>
  <text x="470" y="505" class="sub" fill="#c46210" font-weight="bold">blunder</text>

  <line x1="60" y1="303" x2="600" y2="303" class="mean" stroke="#006600"/>
  <text x="330" y="140" class="sub" fill="#006600" text-anchor="middle">mean = 0</text>

  <!-- ===== Panel B: systematic ===== -->
  <text x="700" y="52" class="title" fill="#660066">Systematic error</text>
  <text x="700" y="86" class="small">a dome: every average keeps the bias</text>

  <line x1="700" y1="170" x2="1240" y2="170" class="limit"/>
  <line x1="700" y1="430" x2="1240" y2="430" class="limit"/>

  <line x1="700" y1="300" x2="1240" y2="300" class="zero"/>
  <text x="1248" y="308" class="small">0</text>

  <g class="stickB">
    <line x1="730"  y1="300" x2="730"  y2="290"/>
    <line x1="775"  y1="300" x2="775"  y2="270"/>
    <line x1="820"  y1="300" x2="820"  y2="245"/>
    <line x1="865"  y1="300" x2="865"  y2="228"/>
    <line x1="910"  y1="300" x2="910"  y2="218"/>
    <line x1="955"  y1="300" x2="955"  y2="215"/>
    <line x1="1000" y1="300" x2="1000" y2="220"/>
    <line x1="1045" y1="300" x2="1045" y2="232"/>
    <line x1="1090" y1="300" x2="1090" y2="250"/>
    <line x1="1135" y1="300" x2="1135" y2="270"/>
    <line x1="1180" y1="300" x2="1180" y2="285"/>
    <line x1="1225" y1="300" x2="1225" y2="292"/>
  </g>
  <g class="dotB">
    <circle cx="730" cy="290" r="8"/><circle cx="775" cy="270" r="8"/><circle cx="820" cy="245" r="8"/>
    <circle cx="865" cy="228" r="8"/><circle cx="910" cy="218" r="8"/><circle cx="955" cy="215" r="8"/>
    <circle cx="1000" cy="220" r="8"/><circle cx="1045" cy="232" r="8"/><circle cx="1090" cy="250" r="8"/>
    <circle cx="1135" cy="270" r="8"/><circle cx="1180" cy="285" r="8"/><circle cx="1225" cy="292" r="8"/>
  </g>

  <line x1="700" y1="251" x2="1240" y2="251" class="mean" stroke="#660066"/>
  <text x="970" y="140" class="sub" fill="#660066" text-anchor="middle">mean well off zero</text>
  <text x="700" y="505" class="small">no blunders here, and the surface is still wrong</text>

  <!-- rule strip -->
  <rect x="60" y="534" width="1180" height="96" rx="10" fill="#f2f7f2" stroke="#006600" stroke-width="3"/>
  <text x="90" y="576" class="sub" font-weight="bold" fill="#006600">Blunder screen</text>
  <text x="320" y="576" class="sub">any residual past 3 x the target RMSE gets investigated</text>
  <text x="90" y="612" class="sub" font-weight="bold" fill="#006600">Bias screen</text>
  <text x="320" y="612" class="sub">a mean error past 25 percent of the target RMSE is a dome</text>
</svg>
