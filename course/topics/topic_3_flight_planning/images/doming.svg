<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 620" font-family="Lato, sans-serif">
  <defs>
    <style>
      .title { font-size: 31px; font-weight: bold; }
      .sub { font-size: 24px; fill: #3e3e3e; }
      .small { font-size: 21px; fill: #6b6b6b; }
      .ray { stroke: #8c8c8c; stroke-width: 3; stroke-dasharray: 9 7; }
      .truth { stroke: #8c8c8c; stroke-width: 5; fill: none; }
      .recon { stroke: #c46210; stroke-width: 6; fill: none; }
      .good { stroke: #006600; stroke-width: 6; fill: none; }
      .cam { fill: #660066; }
    </style>
    <marker id="d-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c8c8c"/>
    </marker>
    <marker id="d-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c46210"/>
    </marker>
  </defs>

  <!-- ============ Panel 1: nadir only ============ -->
  <text x="40" y="52" class="title" fill="#c46210">Nadir only, self-calibration on</text>

  <g class="cam">
    <path d="M 103 100 h 34 v 24 h -5 l -12 16 l -12 -16 h -5 z"/>
    <path d="M 203 100 h 34 v 24 h -5 l -12 16 l -12 -16 h -5 z"/>
    <path d="M 303 100 h 34 v 24 h -5 l -12 16 l -12 -16 h -5 z"/>
    <path d="M 403 100 h 34 v 24 h -5 l -12 16 l -12 -16 h -5 z"/>
    <path d="M 503 100 h 34 v 24 h -5 l -12 16 l -12 -16 h -5 z"/>
  </g>

  <line x1="120" y1="146" x2="120" y2="360" class="ray" marker-end="url(#d-gray)"/>
  <line x1="220" y1="146" x2="220" y2="360" class="ray" marker-end="url(#d-gray)"/>
  <line x1="320" y1="146" x2="320" y2="360" class="ray" marker-end="url(#d-gray)"/>
  <line x1="420" y1="146" x2="420" y2="360" class="ray" marker-end="url(#d-gray)"/>
  <line x1="520" y1="146" x2="520" y2="360" class="ray" marker-end="url(#d-gray)"/>

  <!-- ground and reconstruction -->
  <line x1="100" y1="460" x2="560" y2="460" class="truth"/>
  <path class="recon" d="M 100 460 Q 330 366 560 460"/>

  <line x1="330" y1="459" x2="330" y2="410" stroke="#c46210" stroke-width="3" marker-start="url(#d-orange)" marker-end="url(#d-orange)"/>
  <text x="40" y="420" class="sub" fill="#c46210" font-weight="bold">0.2 m</text>
  <text x="40" y="448" class="small">over 100 m</text>

  <text x="100" y="502" class="small">flat truth in gray, domed reconstruction in orange</text>
  <text x="40" y="556" class="sub" fill="#c46210" font-weight="bold">Lens distortion and surface shape</text>
  <text x="40" y="588" class="sub" fill="#c46210" font-weight="bold">cannot be separated.</text>

  <!-- ============ Panel 2: convergent ============ -->
  <text x="700" y="52" class="title" fill="#006600">Convergent or oblique imagery</text>

  <g class="cam">
    <!-- tilted right by 22 deg -->
    <path d="M 745 88 l 32 13 l -9 22 l -5 -2 l -17 12 l -1 -20 l -5 -2 z"/>
    <path d="M 847 94 l 33 6 l -4 24 l -5 -1 l -14 14 l -4 -20 l -5 -1 z"/>
    <!-- nadir -->
    <path d="M 943 100 h 34 v 24 h -5 l -12 16 l -12 -16 h -5 z"/>
    <!-- tilted left -->
    <path d="M 1053 100 l 33 -6 l 4 24 l -5 1 l -1 20 l -16 -13 l -5 1 z"/>
    <path d="M 1155 101 l 32 -13 l 9 22 l -5 2 l 1 20 l -18 -11 l -5 2 z"/>
  </g>

  <line x1="760" y1="146" x2="922" y2="370" class="ray" marker-end="url(#d-gray)"/>
  <line x1="862" y1="146" x2="941" y2="370" class="ray" marker-end="url(#d-gray)"/>
  <line x1="960" y1="146" x2="960" y2="370" class="ray" marker-end="url(#d-gray)"/>
  <line x1="1058" y1="146" x2="979" y2="370" class="ray" marker-end="url(#d-gray)"/>
  <line x1="1160" y1="146" x2="998" y2="370" class="ray" marker-end="url(#d-gray)"/>
  <text x="700" y="330" class="small">20 to 35 degrees</text>

  <line x1="740" y1="460" x2="1200" y2="460" class="truth"/>
  <line x1="740" y1="460" x2="1200" y2="460" class="good" stroke-dasharray="16 12"/>

  <text x="740" y="502" class="small">reconstruction sits on the truth</text>
  <text x="700" y="556" class="sub" fill="#006600" font-weight="bold">Convergent geometry breaks the ambiguity.</text>
  <text x="700" y="588" class="small">Under 15 degrees can make it worse. Overlap does not fix it.</text>
</svg>
